name: Flutter checks and builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define-from-file=config/supabase.public.json
      - uses: actions/upload-artifact@v4
        with:
          name: mygarage-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=config/supabase.public.json
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app mygarage-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mygarage-ios-simulator
          path: mygarage-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
